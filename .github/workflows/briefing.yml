name: 每日早报推送

on:
  schedule:
    # GitHub Actions 用的是 UTC 时间。
    # UTC 0:00 = 北京时间早上 8:00
    - cron: '0 0 * * *'

  # 允许在网页上手动点一下立刻运行（测试用）
  workflow_dispatch:

# 保活提交需要写权限
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓新闻、写稿并推送到微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python briefing.py

      # 公开仓库 60 天无提交，定时任务会被自动停用。
      # 每月 1 号 / 16 号各提交一次保活，任务就不会被关掉。
      - name: 保活提交
        run: |
          D=$(date -u +%d)
          if [ "$D" != "01" ] && [ "$D" != "16" ]; then
            echo "今天不是 1 号或 16 号，跳过保活提交"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          if git diff --staged --quiet; then
            echo "内容没变，无需提交"
          else
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
